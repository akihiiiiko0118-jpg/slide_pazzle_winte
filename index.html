<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウミウサ明ちゃんパズル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container">
        <h1>ウミウサ明ちゃんパズル</h1>

        <div class="mode-row" aria-label="パズルサイズ">
            <button class="mode-button" type="button" data-size="2">2x2</button>
            <button class="mode-button active" type="button" data-size="3">3x3</button>
            <button class="mode-button" type="button" data-size="4">4x4</button>
        </div>
        
        <div class="info">
            <div class="message-area">
                <div id="message">スタート！</div>
                <div id="shareBox" class="share-box hidden">
                    <a id="shareLink" href="#" target="_blank" rel="noopener noreferrer">Xで結果を共有</a>
                </div>
            </div>
            <div class="score-box">
                <div id="movesDisplay">手数: 0</div>
                <div id="timeDisplay">タイム: 00:00</div>
                <div id="bestScoreDisplay"></div>
                <div id="bestTimeDisplay"></div>
            </div>
        </div>

        <div class="puzzle-area">
            <div id="puzzleBoard">
                </div>
        </div>
        
        <div class="button-area">
            <div class="button-row">
                <button id="retryButton" type="button">リセット</button>
            </div>
            <div class="button-row">
                <button id="newGameButton">新しく始める</button>
                <button id="numberToggleButton" type="button" aria-pressed="true">数字ON</button>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
